<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/kit.css">
<style>
:root{--bg:#F4EFE6;--cap-y:1240px;--cap-size:84px}
/* Стилі сцен цього ролика */
:root{--ink:#1c1b1f;--red:#D7262E;--cap-fg:#fff}
.paper{position:absolute;inset:-80px;background:radial-gradient(circle at 30% 20%,#fffaf1 0,#F4EFE6 55%,#e9e0d0 100%)}
.dots{position:absolute;inset:-80px;background-image:radial-gradient(rgba(28,27,31,.09) 2.4px,transparent 2.6px);background-size:34px 34px}
.k1{font:800 78px/1.05 UI;color:var(--ink);text-transform:uppercase;letter-spacing:-.01em}
.huge{font:800 380px/.9 Osw;color:var(--red);letter-spacing:-.02em}
.box{position:absolute;width:300px;height:250px;background:#c9965a;border-radius:16px;box-shadow:inset 0 -18px 0 rgba(0,0,0,.12),0 30px 60px rgba(0,0,0,.25)}
.box:before{content:"";position:absolute;left:125px;top:0;width:50px;height:100%;background:#e9d3a8}
.box:after{content:"";position:absolute;left:0;top:92px;width:100%;height:16px;background:rgba(0,0,0,.08)}
.bank{position:absolute}
.stampR{position:absolute;border:16px solid var(--red);color:var(--red);border-radius:30px;font:800 160px/1 Osw;padding:30px 60px;text-transform:uppercase;background:rgba(244,239,230,.6)}
.date{font:800 54px/1 UI;color:var(--ink)}
.pct{font:800 430px/.9 Osw;color:var(--ink)}
.pct small{font-size:.45em;color:var(--red)}
.rank{position:absolute;left:110px;width:860px;height:600px;top:430px}
.rank .bar{position:absolute;bottom:0;width:62px;border-radius:12px 12px 0 0;background:#cfc4b2}
.rank .bar.me{background:var(--red)}
.chip{position:absolute;left:90px;width:900px;padding:30px 36px;border-radius:30px;background:#fff;box-shadow:0 22px 50px rgba(0,0,0,.18);font:800 72px/1.05 UI;color:var(--ink);text-transform:uppercase;display:flex;align-items:center;gap:30px}
.chip i{font-style:normal;display:inline-flex;width:110px;height:110px;border-radius:24px;background:var(--red);color:#fff;align-items:center;justify-content:center;font:800 70px Osw;flex:none}
.logo{position:absolute;filter:drop-shadow(0 18px 26px rgba(0,0,0,.18))}
.logo-card{position:absolute;background:#fff;border-radius:40px;padding:30px;box-shadow:0 26px 60px rgba(0,0,0,.18)}
.lic{position:absolute;left:40px;top:1560px;font:800 22px UI;color:rgba(28,27,31,.55);z-index:56}
.cross{position:absolute;left:120px;top:1040px;width:840px;height:16px;background:var(--red);border-radius:8px;transform-origin:0 50%;transform:scaleX(0) rotate(-4deg)}

</style>
<script src="assets/gsap.min.js"></script><script src="assets/kit.js"></script></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="17.11" data-width="1080" data-height="1920">
  <div id="cam">
<!--SCENES-->
    <section class="scene" id="s1"><div class="paper"></div><div class="dots" id="d1"></div>
      <img class="logo" id="bx" src="assets/img/np_icon.png" style="left:110px;top:330px;width:340px;transform:rotate(-6deg)">
      <div class="bank" id="bk" style="left:600px;top:360px;transform:scale(1.25);transform-origin:0 0"><svg viewBox="0 0 300 260" width="300" height="260"><polygon points="150,10 290,80 10,80" fill="#1c1b1f"/><rect x="25" y="88" width="250" height="18" fill="#1c1b1f"/>
<g fill="#1c1b1f"><rect x="40" y="114" width="30" height="100" rx="4"/><rect x="100" y="114" width="30" height="100" rx="4"/><rect x="170" y="114" width="30" height="100" rx="4"/><rect x="230" y="114" width="30" height="100" rx="4"/></g>
<rect x="15" y="222" width="270" height="26" fill="#1c1b1f"/><circle cx="150" cy="52" r="14" fill="#D7262E"/></svg></div>
      <div class="say" id="y1" style="top:720px;--say-size:84px"></div>
      <div class="say" id="y1b" style="top:930px;--say-size:380px;--say-font:Osw"></div>
    </section>
    <section class="scene" id="s2"><div class="paper"></div><div class="dots"></div>
      <img class="logo" id="nbu" src="assets/img/nbu_emblem.svg" style="left:447px;top:200px;width:186px">
      <div class="say" id="y2" style="top:580px;--say-size:100px"></div>
      <div class="stampR" id="dt" style="left:190px;top:1150px;transform:rotate(-5deg);font-size:110px;padding:18px 44px">12.11.2026</div>
    </section>
    <section class="scene" id="s3"><div class="paper"></div><div class="dots"></div>
      <div class="say" id="y3" style="top:440px;--say-size:330px;--say-font:Osw;--say-fg:#1c1b1f"></div>
      <div class="say" id="y3b" style="top:960px;--say-size:120px"></div>
    </section>
    <section class="scene" id="s4"><div class="paper"></div><div class="dots"></div>
      <div class="say" id="y4" style="top:300px;--say-size:96px"></div>
      <div class="rank" id="rk" style="top:560px"><div class="bar" style="left:0px;height:540px"></div><div class="bar" style="left:72px;height:502px"></div><div class="bar" style="left:144px;height:467px"></div><div class="bar" style="left:216px;height:434px"></div><div class="bar" style="left:288px;height:403px"></div><div class="bar" style="left:360px;height:375px"></div><div class="bar" style="left:432px;height:349px"></div><div class="bar" style="left:504px;height:324px"></div><div class="bar" style="left:576px;height:302px"></div><div class="bar" style="left:648px;height:281px"></div><div class="bar" style="left:720px;height:261px"></div><div class="bar me" id="mebar" style="left:792px;height:40px;background:#D7262E"></div></div>
      <div class="center" style="top:1210px;font:800 90px/1 Osw;color:#D7262E" id="r59">59-те місце з 59</div>
    </section>
    <section class="scene" id="s5"><div class="paper"></div><div class="dots"></div>
      <div class="say" id="y5" style="top:280px;--say-size:84px"></div>
      <div class="chip" id="c1" style="top:640px"><i>1</i><span class="say" id="y5a" style="position:static;width:auto;justify-content:flex-start;--say-size:72px"></span></div>
      <div class="chip" id="c2" style="top:860px"><i>2</i><span class="say" id="y5b" style="position:static;width:auto;justify-content:flex-start;--say-size:72px"></span></div>
      <div class="chip" id="c3" style="top:1080px;background:#1c1b1f"><i>!</i><span class="say" id="y5c" style="position:static;width:auto;justify-content:flex-start;--say-size:72px;--say-fg:#fff"></span></div>
    </section>
    <section class="scene" id="s6"><div class="paper"></div><div class="dots"></div>
      <div class="say" id="y6" style="top:560px;--say-size:96px"></div>
      <div class="say" id="y6b" style="top:780px;--say-size:190px;--say-font:Osw"></div>
    </section>
<!--/SCENES-->
  </div>
  <div id="caps"></div><div class="lic">Логотипи: Wikimedia Commons, суспільне надбання</div><div id="flash"></div><div id="grain"></div>
  <audio id="mix" class="clip" data-start="0" data-duration="17.11" data-track-index="6" data-volume="1" src="assets/sound/mix.wav"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({paused: true});
const WORDS = [["Нова", 0.075], ["пошта", 0.415], ["купує", 0.755], ["власний", 1.264], ["банк!", 1.604], ["Нацбанк", 1.774], ["дозволив", 2.434], ["власникам", 2.894], ["Нової", 3.354], ["пошти", 3.814], ["забрати", 4.121], ["сто", 4.581], ["відсотків", 4.735], ["БТА", 5.195], ["Банку.", 5.655], ["Це", 5.962], ["найменший", 6.115], ["банк", 6.896], ["країни.", 7.035], ["На", 7.451], ["його", 7.59], ["основі", 7.867], ["хочуть", 8.604], ["зробити", 8.892], ["банк", 9.325], ["для", 9.469], ["прифронтових", 9.614], ["і", 10.191], ["деокупованих", 10.335], ["громад,", 11.2], ["де", 11.489], ["відділень", 11.633], ["часто", 12.236], ["немає.", 12.523], ["Підписуйся,", 12.954], ["тут", 13.849], ["усе", 14.031], ["про", 14.394], ["економіку!", 14.689]];
const END = 17.11;
Kit.init(WORDS);
const T = Kit.T;
tl.set("#s1", {visibility: "visible"}, 0);
//TIMELINE
const K = ["нацбанк","дозволив","найменш","прифронт","деокупов","немає","бта"];
// 1 хук
Kit.drift(tl, "#d1", 0, 1.8, {to: 1.1, y: -30});
tl.fromTo("#bx", {y: 0, rotation: -8}, {y: -14, rotation: -4, duration: 1.7, ease: "sine.inOut"}, 0);
tl.fromTo("#bk", {y: 0}, {y: 12, duration: 1.7, ease: "sine.inOut"}, 0);
Kit.say(tl, "#y1", 0, 3, {keys: K});
Kit.say(tl, "#y1b", 4, 4, {map: {4: "БАНК"}, keys: ["банк"], kind: "slam"});
// 2 Нацбанк дозволив
Kit.cut(tl, "#s1", "#s2", T(5) - .05, "whip");
Kit.in(tl, "#nbu", T(5) - .1, "pop");
Kit.say(tl, "#y2", 5, 10, {keys: K});
Kit.in(tl, "#dt", T(7), "stamp");
Kit.drift(tl, "#s2", T(5), T(11), {to: 1.04, y: -10});
// 3 100%
Kit.cut(tl, "#s2", "#s3", T(11) - .05, "zoom");
Kit.say(tl, "#y3", 11, 12, {map: {11: "100%", 12: ""}, kind: "slam"});
Kit.say(tl, "#y3b", 13, 14, {keys: K});
Kit.punch(tl, T(13), 1.05);
// 4 найменший
Kit.cut(tl, "#s3", "#s4", T(15) - .05, "push");
Kit.say(tl, "#y4", 15, 18, {keys: K});
Kit.bars(tl, "#rk .bar", T(15) + .1, .04);
Kit.in(tl, "#r59", T(17), "pop");
// 5 для кого
Kit.cut(tl, "#s4", "#s5", T(19) - .05, "slideUp");
Kit.say(tl, "#y5", 19, 25, {keys: K});
Kit.in(tl, "#c1", T(26) - .12, "slideL"); Kit.say(tl, "#y5a", 26, 26, {keys: K});
Kit.in(tl, "#c2", T(27) - .1, "slideR"); Kit.say(tl, "#y5b", 27, 29, {keys: K, map: {27: ""}});
Kit.in(tl, "#c3", T(30) - .1, "rise"); Kit.say(tl, "#y5c", 30, 33, {keys: K});
Kit.drift(tl, "#s5", T(19), T(34), {to: 1.03, y: -8});
// 6 CTA і петля
Kit.cut(tl, "#s5", "#s6", T(34) - .05, "iris");
Kit.say(tl, "#y6", 34, 37, {});
Kit.say(tl, "#y6b", 38, 38, {keys: ["економ"], kind: "slam"});
Kit.loop(tl, "#s6", "#s1", END, "zoom");
///TIMELINE
tl.set({}, {}, END);
window.__timelines["main"] = tl;
</script></body></html>
