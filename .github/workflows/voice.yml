name: Озвучка (Gemini TTS) для ручного ролика

on:
  workflow_dispatch:
    inputs:
      text: { description: "Текст для диктора", required: true }
      voice: { description: "Голос Gemini", required: true, default: "Charon" }
      name: { description: "Назва папки", required: true, default: "manual" }

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q numpy
      - name: Озвучити
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TEXT: ${{ inputs.text }}
        run: |
          mkdir -p voice_out/${{ inputs.name }}
          printf '%s' "$TEXT" > voice_out/${{ inputs.name }}/script.txt
          python tools/cc_voice.py "${{ inputs.voice }}" voice_out/${{ inputs.name }}/script.txt voice_out/${{ inputs.name }}
          rm -f voice_out/${{ inputs.name }}/voice_raw.wav
      - name: Зберегти
        run: |
          git config user.name "provse-autopilot-bot"; git config user.email "actions@users.noreply.github.com"
          git add voice_out && git commit -m "озвучка ${{ inputs.name }} [skip ci]" && git pull --rebase -q && git push
