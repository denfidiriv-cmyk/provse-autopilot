name: Автопілот (тренд -> відео -> YouTube)

on:
  schedule:
    - cron: "17,47 * * * *"   # кожні 30 хвилин
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Не завантажувати на YouTube"
        type: boolean
        default: false
      test:
        description: "Тест: найсильніший тренд, приватне завантаження"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # ключ GitHub не лишається на диску, поки працює Claude Code
      - name: Скіли й музика з приватного репозиторію provse-private
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository_owner }}/provse-private
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Залежності
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q numpy scipy pillow trafilatura
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 || echo "Claude Code не встановився"
          if [ -d private/skills ]; then mkdir -p .claude/skills && cp -r private/skills/* .claude/skills/; fi
          if [ -d private/music ]; then ln -sfn private/music music; fi
      - name: Автопілот
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_DIM: ${{ secrets.YT_TOKEN_DIM }}
          YT_TOKEN_EKONOMIKA: ${{ secrets.YT_TOKEN_EKONOMIKA }}
          YT_TOKEN_YIZHA: ${{ secrets.YT_TOKEN_YIZHA }}
          YT_TOKEN_AVTO: ${{ secrets.YT_TOKEN_AVTO }}
          YT_TOKEN_SPORT: ${{ secrets.YT_TOKEN_SPORT }}
          YT_TOKEN_SVIT: ${{ secrets.YT_TOKEN_SVIT }}
          YT_TOKEN_POLITYKA: ${{ secrets.YT_TOKEN_POLITYKA }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          CC_BUDGET_USD: ${{ vars.CC_BUDGET_USD }}
          CC_DAILY_MAX: ${{ vars.CC_DAILY_MAX }}
          CC_MODEL: ${{ vars.CC_MODEL }}
          TZ: Europe/Kyiv
        run: |
          export HF_BROWSER="$(which google-chrome || which chromium)"
          ARGS=""; [ "${{ inputs.no_upload }}" = "true" ] && ARGS="--no-upload"; [ "${{ inputs.test }}" = "true" ] && ARGS="$ARGS --test"
          # Claude Code зі скілами, якщо він встановився і не вибрано простий рушій (змінна ENGINE=simple)
          if [ -n "$ANTHROPIC_API_KEY" ] && [ "${{ vars.ENGINE }}" != "simple" ] && command -v claude > /dev/null; then
            T=""; [ "${{ inputs.test }}" = "true" ] && T="--test"
            python run_claude.py $T
          else
            python run_autopilot.py $ARGS
          fi
      - name: Відео як артефакт (на 7 днів)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/*.mp4
            job/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "provse-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/*.json state/*.jpg 2>/dev/null || true
          git commit -m "стан автопілота [skip ci]" || echo "без змін"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git pull --rebase -q && git push || echo "push пропущено"
