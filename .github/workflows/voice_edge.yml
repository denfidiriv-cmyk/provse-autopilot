name: Озвучка (Microsoft Edge TTS, запасна) для ручного ролика

# Запасний голос, коли денна квота Gemini вичерпана. Голоси: uk-UA-OstapNeural (чоловічий), uk-UA-PolinaNeural (жіночий).
on:
  workflow_dispatch:
    inputs:
      text: { description: "Текст для диктора", required: true }
      voice: { description: "Голос", required: true, default: "uk-UA-OstapNeural" }
      rate: { description: "Темп, напр. +8%", required: false, default: "+8%" }
      pitch: { description: "Висота, напр. +6Hz", required: false, default: "+0Hz" }
      name: { description: "Назва папки", required: true, default: "manual" }

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q edge-tts
      - name: Озвучити
        env:
          TEXT: ${{ inputs.text }}
        run: |
          D=voice_out/${{ inputs.name }}; mkdir -p $D
          printf '%s' "$TEXT" > $D/script.txt
          edge-tts --voice "${{ inputs.voice }}" --rate="${{ inputs.rate }}" --pitch="${{ inputs.pitch }}" -f $D/script.txt --write-media $D/raw.mp3
          ffmpeg -v error -y -i $D/raw.mp3 -ar 24000 -ac 1 $D/voice.wav && rm $D/raw.mp3
      - name: Зберегти
        run: |
          git config user.name "provse-autopilot-bot"; git config user.email "actions@users.noreply.github.com"
          git add -f voice_out && git commit -m "озвучка ${{ inputs.name }} [skip ci]" && git pull --rebase -q && git push
