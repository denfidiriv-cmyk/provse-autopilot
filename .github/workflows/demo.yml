name: Демо-монтаж (без ключів)

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Тема оформлення: blueprint, chalk, sunny, paper"
        default: "blueprint"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q numpy
      - run: |
          export HF_BROWSER="$(which google-chrome || which chromium)"
          DEMO_THEME="${{ inputs.theme }}" DEMO_PHOTOS=1 python run_autopilot.py --demo
      - uses: actions/upload-artifact@v4
        with: { name: demo-video, path: out/demo.mp4, retention-days: 7 }
