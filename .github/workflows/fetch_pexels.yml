name: Відео-сток (Pixabay або Pexels) для довгих роликів

# Шукає короткі вертикальні/горизонтальні кліпи на Pexels (ліцензія Pexels: безкоштовно, без обов'язкової атрибуції)
# і віддає їх артефактом (не в репозиторій, щоб не роздувати git). Ключ: секрет PEXELS_API_KEY.
on:
  workflow_dispatch:
    inputs:
      queries: { description: "Запити через ; у форматі назва|англійський запит, напр. truck|truck night highway;lab|chemistry lab", required: true }
      orientation: { description: "landscape або portrait", required: false, default: "landscape" }
      per: { description: "Скільки кліпів на запит", required: false, default: "2" }
      name: { description: "Назва артефакту", required: true, default: "stock" }
      provider: { description: "pixabay або pexels", required: false, default: "pixabay" }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити
        env:
          KEY: ${{ inputs.provider == 'pexels' && secrets.PEXELS_API_KEY || secrets.PIXABAY_API_KEY }}
          PROV: ${{ inputs.provider }}
          Q: ${{ inputs.queries }}
          OR: ${{ inputs.orientation }}
          PER: ${{ inputs.per }}
        run: |
          set -e
          [ -n "$KEY" ] || { echo "Немає секрету PIXABAY_API_KEY / PEXELS_API_KEY"; exit 1; }
          mkdir -p out
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          key, q, ori, per = os.environ["KEY"], os.environ["Q"], os.environ["OR"], int(os.environ["PER"])
          credits = {}
          prov = os.environ.get("PROV", "pixabay")
          def get(u, h=None):
              return urllib.request.urlopen(urllib.request.Request(u, headers=dict({"User-Agent": "provse-autopilot"}, **(h or {}))))
          for item in [x for x in q.split(";") if x.strip()]:
              slug, query = [s.strip() for s in item.split("|", 1)]
              got = 0
              if prov == "pixabay":
                  data = json.load(get("https://pixabay.com/api/videos/?" + urllib.parse.urlencode({"key": key, "q": query, "per_page": 20, "safesearch": "true"})))
                  for v in data.get("hits", []):
                      if v.get("duration", 0) < 4:
                          continue
                      vids = v.get("videos", {})
                      # довша сторона 1280-1920 (і для вертикальних кліпів) і не більше 60 МБ, бо GitHub не приймає файли >100 МБ
                      f = next((vids[k] for k in ("medium", "small", "large") if vids.get(k, {}).get("url") and 1280 <= max(vids[k].get("width", 0), vids[k].get("height", 0)) <= 1920 and vids[k].get("size", 0) < 60_000_000), None)
                      if not f or (ori == "landscape" and f["width"] < f["height"]) or (ori == "portrait" and f["width"] > f["height"]):
                          continue
                      name = f"{slug}_{got + 1}.mp4"
                      open(f"out/{name}", "wb").write(get(f["url"]).read())
                      credits[name] = {"pixabay_id": v["id"], "author": v.get("user"), "url": v.get("pageURL"), "duration": v["duration"]}
                      got += 1
                      if got >= per:
                          break
              else:
                  data = json.load(get("https://api.pexels.com/videos/search?" + urllib.parse.urlencode({"query": query, "orientation": ori, "per_page": 10, "size": "medium"}), {"Authorization": key}))
                  for v in data.get("videos", []):
                      if v.get("duration", 0) < 4:
                          continue
                      files = [f for f in v["video_files"] if f.get("file_type") == "video/mp4" and f.get("width") and 1200 <= max(f["width"], f["height"]) <= 2000]
                      if not files:
                          continue
                      f = sorted(files, key=lambda f: -f["width"])[0]
                      name = f"{slug}_{got + 1}.mp4"
                      open(f"out/{name}", "wb").write(get(f["link"]).read())
                      credits[name] = {"pexels_id": v["id"], "author": v["user"]["name"], "url": v["url"], "duration": v["duration"]}
                      got += 1
                      if got >= per:
                          break
              print(slug, "->", got)
          json.dump(credits, open("out/credits.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Віддати окремою гілкою stock-<name> (артефакти недоступні з хмари Claude)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b stock-${{ inputs.name }}
          git config user.name "provse-autopilot-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "сток ${{ inputs.name }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" stock-${{ inputs.name }}
